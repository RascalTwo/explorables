     this file, it cannot drift, and a re-theme keeps them in sync automatically.
     The slots with a literal hex are the meaning-free ones. */
  --c1: var(--accent); /* blue  — ALIAS, reads as "primary/selected" */
  --c2: var(--good); /* green — ALIAS, reads as "success" */
  --c3: var(--warn); /* amber — ALIAS, reads as "caution" */
  --c4: #bc8cff; /* purple — meaning-free */
  --c5: #4ec9b0; /* teal   — meaning-free */
  --c6: var(--danger); /* red — ALIAS, reads as "error" */
  --c7: #5d52b4; /* indigo  — meaning-free (ΔE 21.3 from the nearest intent color) */
  --c8: #b70385; /* magenta — meaning-free (ΔE 20.9) */
  /* No orange slot exists on purpose: every orange sits between --danger (hue 27°)
     and --warn (80°), and none clears ΔE 15 from both under CVD simulation. The
     obvious #f0883e is ΔE 1.5 from --warn to a protanope — indistinguishable. */

  /* Type */
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

  /* Spacing rhythm */
  --r: 8px;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  height: 100%;
}
html {
  /* Paint the canvas itself. body is height:100% (one viewport), so on a page taller
     than the viewport the area BELOW the body box would otherwise reveal the browser's
     default (lighter) canvas when scrolled — showing as a horizontal "line" mid-page
     where body's --bg ends. Putting --bg on the root keeps the whole canvas dark. */
  background-color: var(--bg);
}

body {
  /* A faint top-glow over the flat background — the recurring "radial-gradient at
     60% 0%" idiom, standardized. Sized large and faded to transparent well past the
     fold (color-mix dilutes --panel) so the glow→--bg transition never forms a
     visible edge mid-page — the earlier tight 600px gradient left a "boundary" band. */
  background:
    radial-gradient(1600px 1000px at 50% -30%, color-mix(in srgb, var(--panel) 55%, transparent), transparent 75%),
    var(--bg);
  color: var(--text);
  font: 14px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* Links. There was no bare `a` rule here until 2026-08-19, so every naked anchor
   in every viz fell through to the user-agent default: #0000EE on a #0d1117
   background (2.3:1 — below the 4.5:1 floor), and #551A8B once visited, which is
   1.5:1 and effectively invisible. Both tiers now come from tokens, so they follow
   a re-theme. --c4 keeps the "visited is purple" convention at 8.2:1 instead of
   abandoning it. Lowest possible specificity, so any component rule still wins. */
a {
  color: var(--accent);
  text-underline-offset: 3px;
  text-decoration-thickness: 1px;
}
a:visited { color: var(--c4); }
a:hover { color: var(--text); text-decoration-thickness: 2px; }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

/* Header: title + one-line muted subtitle — the chrome ~19/22 vizzes open with. */
.viz-header {
  padding: 20px 24px;
}
.viz-header h1 {
  margin: 0;
  font-size: 20px;
  font-weight: 650;
  letter-spacing: -0.01em;
}
.viz-header .sub,
.sub {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 12.5px;
}

/* Panels / cards */
.panel,
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: calc(var(--r) * 1.5);
  padding: 16px;
}

/* Slide-in detail drawer (click a node → details). Toggle .open. */
.drawer {
  position: fixed;
  top: 0;
  right: 0;
  height: 100%;
  width: min(420px, 90vw);
  background: var(--panel);
  border-left: 1px solid var(--border);
  transform: translateX(100%);
  transition: transform 0.2s ease;
  overflow: auto;
  padding: 20px;
  z-index: 50;
}
.drawer.open {
  transform: none;
}

/* Legend: the single most common component (~16/22), reinvented differently each
   time. Two swatch shapes: a filled square for nodes, a short rule for edge types. */
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  font-size: 12px;
  color: var(--muted);
}
.legend-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.swatch {
  width: 12px;
  height: 12px;
  border-radius: 3px;
  flex: none;
  background: var(--accent);
}
/* Colour comes from `background` (inherited from .swatch), NOT border-top. It was
   `height:0` + `border-top` until 2026-08-19, which made the documented way to
   colour a swatch — an inline `background:` — a silent no-op: every line swatch in
   the corpus rendered accent-blue regardless of what it was labelling. All 5
   usages passed `background`; none passed `border-top-color`. */
.swatch.line {
  width: 16px;
  height: 2px;
  border-radius: 0;
}
/* Round swatch. Its absence is why 25 vizzes abandoned .swatch entirely and
   hand-rolled a .dot/.sw at five different sizes — the shape was the blocker,
   not the component. */
.swatch.dot {
  border-radius: 50%;
}

/* Status / label pill — uppercase micro-badge. Recurs in ~120 files (the
   border-radius:999px + text-transform:uppercase idiom) and was re-derived at a
   different size almost every time. Modifiers tint text + border together. */
.pill {
  display: inline-block;
  font: 700 11px var(--sans);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 999px;
  border: 1px solid var(--border);
  color: var(--muted);
  white-space: nowrap;
}
.pill.accent {
  color: var(--accent);
  border-color: color-mix(in srgb, var(--accent) 50%, transparent);
}
.pill.good {
  color: var(--good);
  border-color: color-mix(in srgb, var(--good) 50%, transparent);
}
.pill.warn {
  color: var(--warn);
  border-color: color-mix(in srgb, var(--warn) 50%, transparent);
}
.pill.danger {
  color: var(--danger);
  border-color: color-mix(in srgb, var(--danger) 50%, transparent);
}

/* Animated "flow" edge — dashed line whose dashes drift along the path. The
   @keyframes was identical everywhere but for the offset magnitude; here it's one
   class. Apply to an SVG <path>/<line>: <path class="flow" .../>. */
@keyframes viz-dash {
  to {
    stroke-dashoffset: -20;
  }
}
.flow {
  stroke-dasharray: 6 4;
  animation: viz-dash 1s linear infinite;
}

/* Reduced motion. 108 of 161 corpus vizzes animate (rAF, @keyframes, transitions,
   setInterval); 3 guarded it. Guarding per-viz was never going to happen, so the
   kit does it once for everyone that links this file.

   Motion is not removed, it is collapsed: near-zero durations keep transition/
   animation END events firing, so state machines that advance on `transitionend`
   still advance instead of deadlocking (the usual bug in a naive
   `animation: none !important` reset).

   This cannot reach a JS rAF loop. If your viz animates in JS, gate it yourself:
     const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
   and jump to the end state instead of tweening to it. */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }

     rather than freezing it mid-dash. */
  .flow {
    animation: none !important;
  }
}

/* Auto-wrapping SVG label (see labelBox() in viz.js). Fills its <foreignObject>
   and centers; overflow is clipped, never spilled. */
.vsvg-label {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: var(--text);
  font: 12px/1.25 var(--sans);
  overflow: hidden;
  padding: 2px 6px;
}

/* --- .elsewhere — third-party explainers -------------------------------------
   A pointer to somebody ELSE explaining the same thing. Deliberately its own
   look, because a page that cites standards needs three visually distinct
   kinds of evidence and a reader must never mistake one for another:

     normative   what makes the claim true      (RFC / NIST / regulator)
     first-party what we read or decided        (source code, our own choice)
     elsewhere   a second teacher               <- this

   "a different kind of thing" rather than as success or warning.

   Convention that makes it worth having: the `.why` line says what the source
   is actually good for, INCLUDING where it is thinner than its reputation. An
   unread link presented as authoritative is the exact impression this component
   exists to prevent. Pair it with a rot checker — external pages 404.  */
.elsewhere {
  border-left: 2px solid var(--c5);
  padding: 8px 0 2px 12px;
  margin-top: 12px;
}
.elsewhere > .lbl {
  display: block;
  font: 700 9px/1 var(--sans);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--c5);
  margin-bottom: 5px;
}
.elsewhere a {
  color: var(--text);
  font-weight: 700;
  text-decoration: none;
  border-bottom: 1px solid var(--c5);
}
.elsewhere a:hover { color: var(--c5) }
.elsewhere .who { color: var(--faint); font-size: 0.85em; margin-left: 6px }
.elsewhere .why {
  display: block;
  margin-top: 4px;
  color: var(--muted);
  font-size: 0.92em;
  line-height: 1.55;
}

    render: sFanout,
    body: `<p>Opening the MR triggers the pipeline. The <code>plan</code> stage runs <b>one job per environment, in parallel</b> — each gated on <code>merge_request_event</code>.</p>
          <p>Each job is <code>interruptible</code>: push a new commit and the in-flight plans cancel and restart.</p>
          <div class="real">Each <code>plan:&lt;env&gt;</code> resolves <b>only its own environment's credentials</b> (env-scoped CI variables). The prod job never sees dev's secret.</div>`
  },
  {
    tag: "The deep dive",
    title: "What a terraform plan actually does",
    render: sAnatomy,
    body: `<p>A plan is not magic — it's a pipeline. <b>Init</b> installs providers and wires the backend. <b>Validate</b> runs next — purely static, it needs no state at all. Only then does it <b>pull the state</b> (encrypted at rest) with the CI job token and <b>refresh</b>: the provider reads real-world resources through <b>the provider's API</b> to detect drift.</p>
          <p>Now it has two pictures: <b>desired</b> (your HCL) and <b>current</b> (state + reality). The difference <b>is the plan</b>.</p>
          <div class="real"><b>On a merge request it stops at "show".</b> The plan is rendered and posted — never applied.</div>`
  },
  {
    tag: "The ledger",
    title: "What the state file is, and where it lives",
    render: sState,
    body: `<p>The plan pulled "state". State is a <b>JSON ledger</b>. Its one job is to bind <b>the name you chose</b> in HCL (<code>gitlab_project_variable.replica_count</code>) to <b>the opaque ID the provider chose</b> (<code>4711/replica_count</code>) — plus a cached copy of every attribute it last saw.</p>
          <p>That binding is why <code>plan</code> can say <i>"update"</i> instead of <i>"create a second one"</i>. Lose the ledger and Terraform loses all memory of what it built.</p>
          <p><b>Nobody commits a <code>.tfstate</code>.</b> <code>root.hcl</code> generates a <code>backend.tf</code> pointing at GitLab's <code>http</code> backend, so the CI job <code>PUT</code>s and <code>GET</code>s it over the REST API at <code>/api/v4/projects/:id/terraform/state/&lt;env&gt;</code>. GitLab encrypts it with the <b>Lockbox</b> gem (key derived from the instance's <code>db_key_base</code>) and stores the ciphertext in Postgres + object storage.</p>
          <div class="real"><b>Four environments, four state objects</b> — separate locks, separate credentials, separate blast radius. <code>dev</code>'s job holds no token that can read <code>prod</code>'s state.</div>`
  },
  {
    tag: "The socket",
    title: "If you'd rather not keep the state in GitLab",
    render: sBackends,
    body: `<p>For this PoC the state lives in GitLab. If you'd rather it didn't — a different trust boundary, a different operator, a policy that says so — <b>nothing in the codebase has to change</b>. Where state lives is a deployment detail.</p>
          <p>Terraform's <code>backend</code> block is an <b>interface</b>. Your HCL, your modules, your pipeline — none of them know or care where state lives. <b>Twelve backends ship with Terraform 1.x</b>: Amazon S3, Azure Blob, Google Cloud Storage, Oracle OCI Object Storage, Alibaba OSS, Tencent COS, a PostgreSQL database, Consul's KV store, a Kubernetes Secret, HCP Terraform, local disk — and <code>http</code>, any endpoint that speaks the protocol. GitLab is simply a server that speaks <code>http</code>. Nothing more exotic than that.</p>
          <p>And the artifact is portable: state is <b>plain JSON</b> with a <code>version</code>, a <code>serial</code>, a <code>lineage</code> and a list of resources. The backend is a transport; it never owned the format. <code>terraform init -migrate-state</code> copies it into a new home.</p>
          <div class="real"><b>The requirement isn't "use GitLab" — it's "treat state as sensitive."</b> Meet that bar and <b>any</b> of the twelve is a legitimate home for it. Pick the one whose access-control story you actually want to own.</div>`
  },
  {
    tag: "The move",
    title: "“If we move it, same security” — mostly no",
    render: sMoveState,
    body: `<p>So we <i>can</i> move it. Would the security follow? The honest answer has three parts, and only the first is the comforting one.</p>
          <p><b>Encryption at rest transfers for free.</b> Every serious backend has it — Azure Blob encrypts by default and won't even let you turn it off. Roll your own and you get exactly what your storage layer gives you, no more. Nobody really wins this row.</p>
          <p><b>Authorization does not transfer.</b> Today GitLab <i>hands</i> you a working access-control plane: project membership, roles, <code>admin_terraform_state</code>, one place to audit. A storage account hands you an <b>empty</b> one; a service you write yourself hands you a <b>compiler</b>. You now own an Entra RBAC assignment — or every line of authn/authz — plus locking, versioning and network rules, and you own <b>keeping them correct forever</b>. That's not the same security; that's the same security <i>if you build it and never drift</i>.</p>
          <p><b>What you gain</b> is real, though: custody of your own key (CMK / KMS — or entirely yours, if you host it), network isolation up to and including an air-gap, and a genuine versioning-and-rollback story, which GitLab does not publish.</p>
          <div class="real"><b>And the row that never moves:</b> no backend on earth makes state opaque to whoever holds a valid credential. If the actual worry is "a human reads a secret out of prod state", <b>relocating the file does not address it</b>.</div>`
  },
  {
    tag: "Roll your own",
    title: "If none of the twelve fit, the door is open",
    render: sHttpBackend,
    body: `<p>Suppose every supported backend fails a hard requirement — an air-gap, a sovereignty rule, an HSM you're obliged to use. You are <b>not stuck</b>. The <code>http</code> backend is a published contract, and anything that speaks it is a valid state store.</p>
          <p><b>Five verbs.</b> <code>GET</code> the state. <code>POST</code> it back (with the lock ID as a query param). <code>LOCK</code> and <code>UNLOCK</code> — returning <b>423 Locked</b> plus the holding lock info when it's already taken. <code>DELETE</code> to purge. Point <code>root.hcl</code> at your <code>address</code> / <code>lock_address</code> and Terraform never knows the difference. Basic auth or mTLS, your choice.</p>
          <p>Then the state sits <b>wherever you want</b> — a bucket you control, a vault, an HSM-backed store, a box with no route to the internet.</p>
          <div class="real"><b>But be honest about the bill.</b> A conformant server is an afternoon; <i>owning</i> one is forever. You inherit lock correctness under concurrency, durability, versioning, backup/restore, authn/authz, and the 3am page when a stale lock wedges a prod apply. GitLab and S3 give you all of that for free. <b>"We might want to someday" is not a requirement.</b></div>`
  },
  {
    tag: "The loop",
    title: "…and again, for all four",
    render: sLoop,
    body: `<p>That whole anatomy runs <b>four times over</b>, once per environment. The MR ends up with four plans side by side.</p>
          <p>You see them as the <b>native Terraform widget</b>, as <b>per-env comments</b>, and as <b>downloadable artifacts</b>.</p>
          <div class="real">Reviewers approve against <b>exactly what will change</b>, per environment — not a hand-wave. Still nothing applied.</div>`
  },
  {
    tag: "Merge to main",
    title: "Merge applies dev → test → stage",
    render: sApply,
    body: `<p>On merge to <code>main</code>, the pipeline re-plans and then <b>applies sequentially</b>: <code>apply:dev</code>, then <code>test</code>, then <code>stage</code> — each <code>needs</code> the previous to succeed.</p>
          <p>A failure partway through <b>stops the chain</b> before it reaches prod.</p>
          <div class="real">Sequential <code>needs</code> chaining means prod is only ever reached after the lower environments proved the change applies cleanly.</div>`
  },
  {
    tag: "The gate",
    title: "prod parks behind a manual gate",
    render: sGate,
    body: `<p>The pipeline reaches <code>apply:prod</code> and <b>stops</b>. <code>when: manual</code> means it will not run until a human clicks ▶.</p>
          <p>And not just any human: prod is a <b>Protected Environment</b> and <code>interruptible: false</code>, so a parked gate <i>lingers</i> instead of being cancelled. <code>resource_group: prod</code> then keeps two lingering gates from firing at once.</p>
          <p>But the click alone doesn't apply anything. A <b>pre-apply step calls the external change-management system</b> and asks: <i>is there an approved CAB window covering right now?</i> No active window → the job <b>fails before <code>terraform apply</code> ever runs</b>. The gate is <b>fail-closed</b>: the machine enforces the window, not the maintainer's memory.</p>
          <div class="real"><b>Every</b> env's applies are already serialized by GitLab <b>state locking</b> — the prod extras here are about <b>who</b> may apply and <b>when</b>. "Who" = Protected Environment (Maintainers+). "When" = the external CAB window check — which is what makes an out-of-window prod apply <b>physically impossible from the pipeline</b>.</div>`
  },
  {
    tag: "The stack",
    title: "Parked, not lost — the plan stacks",
    render: sStack,
    body: `<p>Holding prod doesn't drop the change. Every later merge applies to dev/test/stage right away but <b>stacks onto prod's pending plan</b>.</p>
          <p>You don't approve each change separately — the pending diff just <b>grows</b>. When prod is finally approved, <b>everything queued since the last prod apply goes in together</b>.</p>
          <div class="real"><b>That's the feature:</b> at approval time you review one cumulative diff and see <b>exactly</b> what you're letting into prod.</div>`
  },
  {
    tag: "The authority",
    title: "Who presses it, when, and for what",
    render: sCab,
    body: `<p>The play button is the easy part. <b>Earning the right to press it</b> is the rest.</p>
          <p>A change only reaches the prod question after the <b>team</b> built it, got it <b>reviewed</b> (MR, ≥2 approvers), and watched it <b>deploy and validate</b> across dev, test and stage. <i>Then</i> the team files a <b>change request</b> and the <b>CAB</b> weighs risk and timing.</p>
          <p>Approval doesn't live in someone's head — it's written to an <b>external change-management system</b> as a machine-readable window <code>[start → end]</code> <b>bound to a specific commit</b>. When a Maintainer clicks ▶, a <b>pre-apply step queries that system</b> and passes only if the window is open <i>and</i> the commit being deployed is the approved one. Anything else → <b>the job fails before terraform, fail-closed</b>.</p>
          <div class="real"><b>Two gates, stacked:</b> a technical one (the protected manual job) and the <b>CAB approval in the external system</b> — a <b>window</b> and a <b>commit</b>. Because the pipeline <i>checks</i> both rather than trusting the operator, deploying the <b>wrong commit</b> or at the <b>wrong time</b> is <b>physically impossible</b> — not merely policy-violating. The window even closes itself when it ends.</div>`
  },
  {
    tag: "The tripwire",
    title: "If someone goes around all this — how would we know?",
    render: sTripwire,
    body: `<p>Everything so far is the <b>happy path</b> — an approved change flowing through. But suppose someone edits PingOne <b>in the console</b>, outside Terraform (a break-glass session, or a leaked credential). Two layers catch it.</p>
          <p><b>Layer 1 — scheduled drift detection.</b> A per-env job re-plans live PingOne against the <b>approved baseline commit recorded in state</b> (the last <i>applied</i> commit per env, so the parked prod gate isn't misread). A non-empty plan <b>fails the job and captures the diff</b>; the baseline is un-forgeable because writing it needs <code>admin_terraform_state</code> — CI only.</p>
          <p><b>Layer 2 — audit-log polling.</b> Drift only sees <i>managed</i> objects, so a brand-new hand-made object could hide. So a <b>log collector polls PingOne's audit API</b> (<code>GET /activities</code>) every ~minute for config-change events — <code>APPLICATION.UPDATED</code>, <code>POLICY.UPDATED</code>, <code>POPULATION.UPDATED</code>, <code>RESOURCE.UPDATED</code> … — and routes them to the <b>SIEM</b>. It's a <b>pull</b>, not a webhook: no inbound connections are opened.</p>
          <p>The machine-enforced prod window (previous step) is what makes this tripwire sharp. Because the pipeline is <b>fail-closed on the CAB window</b>, it <b>physically cannot apply to prod out of band</b> — so the only way to change prod outside an approved window is a <b>console write</b>. That collapses the tripwire's job to one residual path, and lets the SIEM alarm on <b>any</b> prod-affecting event whose timestamp falls outside a CAB-approved window, not just on drift.</p>
          <div class="real"><b>Drift = "managed config changed"; audit stream = "any human touched the system."</b> Together they're the Tripwire equivalent — paired with break-glass-only console write for prevention. <span style="color:var(--muted)">\uD83D\uDD35 Exact event set + drift destination still being finalized.</span></div>`
  },
  {
    tag: "Epilogue",
    title: "Divergence & secret hygiene",
    render: sEpilogue,
    body: `<p>Same module, four shapes: replicas scale <b>2 → 2 → 3 → 5</b>, prod runs the <b>premium</b> tier and carries extra labels — all just different <i>inputs</i>.</p>
          <p>Secrets that land in state are <b>manageable, not harmless</b>: state is encrypted at rest, but served in plaintext to any <b>Developer+</b>. Provider-auth tokens stay <b>ephemeral</b> and never land at all — which is the only bulletproof answer.</p>
          <div class="real">The journey ends where it began — one module, four isolated environments, and a prod door only the right people can open.</div>`
  }

var railEl = $("#rail");
var stageEl = $("#stage");
var nTag = $("#nTag");
var nTitle = $("#nTitle");
var nBody = $("#nBody");
var counter = $("#counter");
var prevBtn = $("#prev");
var nextBtn = $("#next");
STEPS.forEach((st, i) => {
  const c = document.createElement("div");
  c.className = "chip";
  c.dataset["i"] = String(i);
  c.innerHTML = `<span class="n">${String(i + 1).padStart(2, "0")}</span>${st.tag}`;
  c.addEventListener("click", () => go(i));
  railEl.appendChild(c);
});
var cur = loadHash().step ?? 0;
if (cur < 0 || cur >= STEPS.length)
  cur = 0;
function render() {
  const st = STEPS[cur];
  stageEl.innerHTML = st.render();
  nTag.textContent = "Step " + (cur + 1) + " · " + st.tag;
  nTitle.textContent = st.title;
  nBody.innerHTML = st.body;
  counter.textContent = `Step ${cur + 1} of ${STEPS.length}`;
  prevBtn.disabled = cur === 0;
  nextBtn.disabled = cur === STEPS.length - 1;
  $$(".chip").forEach((c, i) => {
    c.classList.toggle("active", i === cur);
    c.classList.toggle("done", i < cur);
  });
}
function go(i) {
  cur = Math.max(0, Math.min(STEPS.length - 1, i));
  saveHash({ step: cur });
  render();
}
prevBtn.addEventListener("click", () => go(cur - 1));
nextBtn.addEventListener("click", () => go(cur + 1));
window.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === "PageDown")
    go(cur + 1);
  if (e.key === "ArrowLeft" || e.key === "PageUp")
    go(cur - 1);
});
render();
</script>
