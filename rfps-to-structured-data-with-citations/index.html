<style>
/* viz-kit.css — the /viz house style. Load with:
     <link rel="stylesheet" href="/_kit/viz-kit.css">
   Served by the viz server at /_kit/viz-kit.css from the skill's own kit/ dir.

   Why this exists: nearly every viz independently re-derived the same dark theme
   (a GitHub-dark palette), re-guessed the exact hexes (so the "same" background
   drifted across files), and invented its own variable names (--txt vs --text vs
   --ink) for identical concepts. This file fixes the palette and the names ONCE so
   you can reach for var(--accent) / var(--good) instead of re-picking colors.

   The dark GitHub-ish palette is the DEFAULT, not a constraint. Every rule below
   reads its colors through var() — there is not one hardcoded hex outside :root —
   so a page needing a brand or one-off palette overrides the tokens in a later
   :root and keeps every component. Re-theme; don't fork. See kit/README.md. */

:root {
  /* Surfaces, back to front */
  --bg: #0d1117;
  --panel: #161b22;
  --panel-2: #21262d;
  --border: #30363d;

  /* Text — three tiers. --faint is for de-emphasized chrome (axis ticks, units,
     footnotes, "n of m" counters); 72 vizzes re-derived a third tier by hand
     before it existed here, at half a dozen different grays. */
  --text: #e6edf3;
  --muted: #8b949e;
  --faint: #6e7681;

  /* Intent — accents that carry meaning */
  --accent: #58a6ff; /* primary / links / selection */
  --good: #3fb950; /* success / healthy / "yes" */
  --warn: #d29922; /* caution / pending */
  --danger: #f85149; /* error / blocked / "no" */

  /* Categorical ramp — visually separable hues for diagram categories / series.
     Use these when you need N separable colors, NOT meaning.

     ⚠ ALIASING TRAP — c1/c2/c3/c6 are byte-identical to the intent colors above:
       --c1 == --accent   --c2 == --good   --c3 == --warn   --c6 == --danger
     So a categorical series rendered in --c2 reads as "success" next to anything
     using --good, and --c6 reads as "error". Only --c4, --c5, --c7, --c8 are
     unique to this ramp. This has already caused rework (a poster themed on --c2
     went monochrome against a --good meter and had to be re-themed to --c5).
     If your viz mixes categorical series WITH semantic color, pick from
     --c4/--c5/--c7/--c8 first, then reach for the aliased four knowingly.

     The four aliased slots are DEFINED AS the intent colors rather than repeating
     their hexes. That's deliberate: the aliasing is self-evident wherever you read
     this file, it cannot drift, and a re-theme keeps them in sync automatically.
     The slots with a literal hex are the meaning-free ones. */
  --c1: var(--accent); /* blue  — ALIAS, reads as "primary/selected" */
  --c2: var(--good); /* green — ALIAS, reads as "success" */
  --c3: var(--warn); /* amber — ALIAS, reads as "caution" */
  --c4: #bc8cff; /* purple — meaning-free */
  --c5: #4ec9b0; /* teal   — meaning-free */
  --c6: var(--danger); /* red — ALIAS, reads as "error" */
  --c7: #5d52b4; /* indigo  — meaning-free (ΔE 21.3 from the nearest intent color) */
  --c8: #b70385; /* magenta — meaning-free (ΔE 20.9) */
  /* No orange slot exists on purpose: every orange sits between --danger (hue 27°)
     and --warn (80°), and none clears ΔE 15 from both under CVD simulation. The
     obvious #f0883e is ΔE 1.5 from --warn to a protanope — indistinguishable. */

  /* Type */
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

  /* Spacing rhythm */
  --r: 8px;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  height: 100%;
}
html {
  /* Paint the canvas itself. body is height:100% (one viewport), so on a page taller
     than the viewport the area BELOW the body box would otherwise reveal the browser's
     default (lighter) canvas when scrolled — showing as a horizontal "line" mid-page
     where body's --bg ends. Putting --bg on the root keeps the whole canvas dark. */
  background-color: var(--bg);
}

body {
  /* A faint top-glow over the flat background — the recurring "radial-gradient at
     60% 0%" idiom, standardized. Sized large and faded to transparent well past the
     fold (color-mix dilutes --panel) so the glow→--bg transition never forms a
     visible edge mid-page — the earlier tight 600px gradient left a "boundary" band. */
  background:
    radial-gradient(1600px 1000px at 50% -30%, color-mix(in srgb, var(--panel) 55%, transparent), transparent 75%),
    var(--bg);
  color: var(--text);
  font: 14px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* Links. There was no bare `a` rule here until 2026-08-19, so every naked anchor
   in every viz fell through to the user-agent default: #0000EE on a #0d1117
   background (2.3:1 — below the 4.5:1 floor), and #551A8B once visited, which is
   1.5:1 and effectively invisible. Both tiers now come from tokens, so they follow
   a re-theme. --c4 keeps the "visited is purple" convention at 8.2:1 instead of
   abandoning it. Lowest possible specificity, so any component rule still wins. */
a {
  color: var(--accent);
  text-underline-offset: 3px;
  text-decoration-thickness: 1px;
}
a:visited { color: var(--c4); }
a:hover { color: var(--text); text-decoration-thickness: 2px; }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

/* Header: title + one-line muted subtitle — the chrome ~19/22 vizzes open with. */
.viz-header {
  padding: 20px 24px;
}
.viz-header h1 {
  margin: 0;
  font-size: 20px;
  font-weight: 650;
  letter-spacing: -0.01em;
}
.viz-header .sub,
.sub {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 12.5px;
}

/* Panels / cards */
.panel,
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: calc(var(--r) * 1.5);
  padding: 16px;
}

/* Slide-in detail drawer (click a node → details). Toggle .open. */
.drawer {
  position: fixed;
  top: 0;
  right: 0;
  height: 100%;
  width: min(420px, 90vw);
  background: var(--panel);
  border-left: 1px solid var(--border);
  transform: translateX(100%);
  transition: transform 0.2s ease;
  overflow: auto;
  padding: 20px;
  z-index: 50;
}
.drawer.open {
  transform: none;

.legend {

  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  font-size: 12px;
  color: var(--muted);
}
.legend-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.swatch {
  width: 12px;
  height: 12px;
  border-radius: 3px;
  flex: none;
  background: var(--accent);
}

   `height:0` + `border-top` until 2026-08-19, which made the documented way to
   colour a swatch — an inline `background:` — a silent no-op: every line swatch in
   the corpus rendered accent-blue regardless of what it was labelling. All 5
   usages passed `background`; none passed `border-top-color`. */
.swatch.line {
  width: 16px;
  height: 2px;
  border-radius: 0;
}

   hand-rolled a .dot/.sw at five different sizes — the shape was the blocker,
   not the component. */

  border-radius: 50%;
}

   border-radius:999px + text-transform:uppercase idiom) and was re-derived at a
   different size almost every time. Modifiers tint text + border together. */
.pill {
  display: inline-block;
  font: 700 11px var(--sans);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 999px;
  border: 1px solid var(--border);
  color: var(--muted);
  white-space: nowrap;
}
.pill.accent {
  color: var(--accent);
  border-color: color-mix(in srgb, var(--accent) 50%, transparent);
}
.pill.good {
  color: var(--good);
  border-color: color-mix(in srgb, var(--good) 50%, transparent);
}
.pill.warn {
  color: var(--warn);
  border-color: color-mix(in srgb, var(--warn) 50%, transparent);
}
.pill.danger {
  color: var(--danger);
  border-color: color-mix(in srgb, var(--danger) 50%, transparent);

   @keyframes was identical everywhere but for the offset magnitude; here it's one
   class. Apply to an SVG <path>/<line>: <path class="flow" .../>. */
@keyframes viz-dash {
  to {
    stroke-dashoffset: -20;
  }
}
.flow {
  stroke-dasharray: 6 4;
  animation: viz-dash 1s linear infinite;
}

   setInterval); 3 guarded it. Guarding per-viz was never going to happen, so the
   kit does it once for everyone that links this file.

   animation END events firing, so state machines that advance on `transitionend`
   still advance instead of deadlocking (the usual bug in a naive
   `animation: none !important` reset).

     const still = matchMedia("(prefers-reduced-motion: reduce)").matches;

  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;

     rather than freezing it mid-dash. */
  .flow {
    animation: none !important;
  }

   and centers; overflow is clipped, never spilled. */
.vsvg-label {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: var(--text);
  font: 12px/1.25 var(--sans);
  overflow: hidden;
  padding: 2px 6px;
}

/* --- .elsewhere — third-party explainers -------------------------------------
   A pointer to somebody ELSE explaining the same thing. Deliberately its own
   look, because a page that cites standards needs three visually distinct
   kinds of evidence and a reader must never mistake one for another:

     normative   what makes the claim true      (RFC / NIST / regulator)
     first-party what we read or decided        (source code, our own choice)
     elsewhere   a second teacher               <- this

   "a different kind of thing" rather than as success or warning.

   Convention that makes it worth having: the `.why` line says what the source
   is actually good for, INCLUDING where it is thinner than its reputation. An
   unread link presented as authoritative is the exact impression this component
   exists to prevent. Pair it with a rot checker — external pages 404.  */
.elsewhere {
  border-left: 2px solid var(--c5);
  padding: 8px 0 2px 12px;
  margin-top: 12px;
}
.elsewhere > .lbl {
  display: block;
  font: 700 9px/1 var(--sans);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--c5);
  margin-bottom: 5px;
}
.elsewhere a {
  color: var(--text);
  font-weight: 700;
  text-decoration: none;
  border-bottom: 1px solid var(--c5);
}
.elsewhere a:hover { color: var(--c5) }
.elsewhere .who { color: var(--faint); font-size: 0.85em; margin-left: 6px }
.elsewhere .why {
  display: block;
  margin-top: 4px;
  color: var(--muted);
  font-size: 0.92em;
  line-height: 1.55;
}

<style>
:root{
  --navy-0:#081428; --navy-1:#0a1a35; --navy-2:#0d2247; --navy-3:#123059;
  --ink:#eef4ff; --muted:#9ab0cf; --faint:#5f7699;
  --accent:#37d9a0; --accent-dim:#1f9e77;
  --t-teal:#4bad9e; --t-blue:#3f8fd4; --t-green:#57b85b; --t-lime:#9bcf3f;
  --t-red:#d0453a; --t-amber:#e6902e; --t-violet:#9d7bd8;
  --good:#57b85b; --warn:#e6902e; --danger:#d0453a;
  --paper:#f7f5f0; --mark:#d0453a;
  --panel:rgba(12,28,56,.82); --panel-brd:rgba(120,160,230,.24);

  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:auto}
body{font-family:var(--sans);background:#050d1c;color:var(--ink);-webkit-font-smoothing:antialiased}

/* ── the camera ────────────────────────────────────────────────────────────────
   #cam is a fixed window onto #world. #world is one enormous absolutely-positioned
   canvas that is never re-laid-out — only transformed. #scrollrail is an empty tall
   element whose only job is to give the document a scroll range for the camera to
   read. Nothing scrolls visually; scrolling IS the camera dolly.

   `clip`, NOT `hidden`, and that one word is load-bearing. `overflow:hidden` makes #cam
   a scroll container — invisibly, since it has no scrollbars, but a real one the browser
   is entitled to scroll. Every keyframe id is also the id of a real element inside
   #world, so opening the page at `#cost` made Chrome do its own fragment handling and
   scroll that element into view INSIDE the camera: #cam ended up at scrollLeft 2759,
   scrollTop 5192 and stayed there. The story's scroll position, the step counter and the
   transform were all correct and the picture was 5,000px off screen — a blank page on
   every deep link into a scene far down the canvas. Focusing one of the source links in
   the world would have done the same thing. `overflow:clip` clips identically and is not
   scrollable, so there is nothing to scroll wrong. */
#cam{position:fixed;inset:0;overflow:clip;z-index:1;
  background:
    radial-gradient(1400px 900px at 68% 22%, rgba(55,217,160,.07), transparent 62%),
    linear-gradient(160deg,#0a1a35,#081428 55%,#050d1c)}

   thing to add. will-change:transform gives #world a cached raster that Chrome has to
   redo whenever the scale changes — and the scale changes on every scroll frame, over a
   layer tens of thousands of units across. A fast flick outran the re-raster, so bands
   of the picture arrived a frame or two late: sheets half-drawn, chunks of a scene
   simply missing mid-flight. Without it Chrome just paints each frame at the scale it
   is actually being shown at, which is both correct and, here, faster. Confirmed by
   toggling it live in the console against the flicker. (#hud does have it, and should:
   that layer is one screen big and static between beats — the case will-change is for.) */
#world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0}
#scrollrail{position:relative;z-index:0;pointer-events:none}

/* Everything placed in the world is absolutely positioned in world units. */
.node{position:absolute}

/* ── paper ─────────────────────────────────────────────────────────────────── */
.sheet{background:var(--paper);box-shadow:0 0 0 1px rgba(0,0,0,.35), 0 60px 160px rgba(0,0,0,.55);
  overflow:hidden}
.sheet img{display:block;width:100%;height:100%;object-fit:cover}
.sheet.dim img{filter:saturate(.15) brightness(.82)}

/* A located citation, drawn from real PDF coordinates. */
.mark{position:absolute;border:0 solid var(--mark);background:rgba(208,69,58,.14);
  opacity:0;transition:opacity .45s ease}
.mark.on{opacity:1}
.mark.solid{background:rgba(208,69,58,.20)}

/* The callout that names what a red box turned into. */
.callout{position:absolute;opacity:0;transition:opacity .4s ease;pointer-events:none}
.callout.on{opacity:1}
.callout .k{font-family:var(--mono);color:var(--accent);letter-spacing:.04em}
.callout .v{color:var(--ink);font-weight:700}
.callout .rule{background:var(--accent);height:2px;opacity:.75}

/* ── page grids (a whole document as one sprite sheet) ─────────────────────────
   ONE <img> of the sprite, plus one transparent overlay per page. The previous
   version gave every page its own giant CSS background — 22 copies of a 16000px
   raster (275 copies of a 19600px one for Providence), each re-rasterised on every
   camera scale change. Chrome painted them blank for the whole fly-in and locked up
   outright when a `filter:` landed on all of them at once. An <img> is one raster;
   an overlay that only ever changes colour composites and never repaints. Nothing
   here uses `filter` or `opacity` on a page-sized box for that reason. */

.gridsheet{position:absolute;left:0;top:0;display:block}

   side of the hero are the backdrop the answer panel is read against. */
.cell{position:absolute;background:rgba(5,12,26,.9);

.cell.seen{background:rgba(6,14,30,.16)}
.cell.hit{background:transparent;z-index:2;

   equally-lit pages is not a finding anyone can see from the back of a room. */
.spotlight .cell:not(.hit){background:rgba(4,10,22,.88)}

   survive being 180px wide on screen. */
.cell .mark{border-width:0;background:rgba(208,69,58,.62);border-radius:2%}

/* A stack of paper seen edge-on. One slab per few pages, so a 275-page book and a
   2-page addendum are told apart at a glance instead of by reading a caption. */
.slab{position:absolute;background:#dcd8cf;box-shadow:0 0 0 1px rgba(0,0,0,.22)}

.wbox{position:absolute;border:2px solid var(--panel-brd);border-radius:14px;
  background:rgba(12,28,56,.42)}
.wlabel{position:absolute;font-family:var(--mono);color:var(--muted);
  letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.wbig{position:absolute;font-weight:900;color:var(--ink);line-height:.95;
  letter-spacing:-.02em}
.station{position:absolute;border-radius:18px;border:2px solid var(--panel-brd);
  background:rgba(10,26,53,.72);display:flex;flex-direction:column;justify-content:center;
  align-items:center;text-align:center;padding:0 3%}
.station.human{border-color:rgba(230,144,46,.45);background:rgba(48,30,10,.5)}
.station.ai{border-color:rgba(55,217,160,.42);background:rgba(8,44,36,.5)}
.station .t{font-weight:900;color:var(--ink)}
.station .d{color:var(--muted);font-weight:400}
.station .n{font-family:var(--mono);font-weight:600}

   The HUD is static between beats; on its own layer it is rastered once and composited,
   instead of being re-rendered against a world layer that re-rasters every frame. */
#hud{position:fixed;inset:0;z-index:5;pointer-events:none;will-change:transform}

   vanishes. A scrim costs nothing at every other altitude. */

   was already a static title nobody needed. The canvas gets the height back. */

   viewport below ~570px, painting chapter dashes over "01/25" and the › button.

   children↔stops index correspondence are untouched.

   centred with the top ~85px reserved for #nav/#beatcount, so it needs a ~1000px
   viewport. No laptop has one. Nor can spacing recover it — the marks ALONE are 419px
   (25 heads x 5 + 42 dots x 7) against a 512px budget at 682px tall, so even zero gap

   gaps with them: 25 chapter bars plus the open chapter's pages, ~420px worst case. */

#topbar h2{font-size:25px;line-height:1.14;font-weight:900;letter-spacing:-.01em}
#topbar .src{display:block;margin-top:7px;font-size:10.5px;color:var(--faint);line-height:1.4}
#topbar .src a{color:var(--faint)}

  display:none;font-family:var(--mono);font-size:11px;letter-spacing:.12em;

#freebadge b{color:var(--accent)}

body.freelook #topbar,body.freelook #beatcount,body.freelook #rail{display:none}
body.freelook #cam{cursor:grab}
body.dragging #cam{cursor:grabbing}

body.freelook #world{pointer-events:none}
#nav button.act{background:#12312a;border-color:var(--accent);color:var(--accent)}

@media (prefers-reduced-motion: reduce){
  .mark,.callout,.cell{transition:none}
  .narr.swap{animation:none}
}

      solicitationNumber: "Procurement/MinuteTraq #: 52281",
      intent: "The City of Providence Department of Public Works seeks to qualify multiple contractors under a blanket contract to perform sidewalk, road, bridge, drainage and other similar construction within the public right-of-way or other City-owned areas as funding opportunities and needs arise, with work assigned by Task Order.",
      scope: "Work is divided into two categories: 1) Sidewalk, Road, and Drainage Construction — full frontage sidewalk repairs, spot sidewalk repairs, utility patch restorations (road and sidewalk), full depth road restoration including granular and rigid base, minor milling/paving, drainage work including catch basin/manhole repairs, installation of speed lumps/raised crosswalks; and 2) Bridge Construction — bridge construction, maintenance and repairs. Also includes restoration of roadway striping and traffic detection loops and all incidentals.",

      estimatedValue: null,
      eligibleApplicants: "Qualified and responsible contractors with at least 5 years construction experience within the last 7 years on Roadway and/or Bridge Improvement Projects; out-of-state corporations must be registered to transact business in Rhode Island. MBE/WBE participation goals (20% combined) apply to Task Orders, and MBE/WBE firms are actively sought.",
      submissionMethod: "Physical delivery of sealed bids to the Department of the City Clerk, City Hall Room 311, 25 Dorrance Street, Providence, RI 02903 — 2 copies (one original and one paper copy) in sealed, labeled envelopes plus an electronic copy in .PDF format on a USB flash drive. No CDs or emailed PDFs accepted.",
      evaluationCriteria: "Award to the lowest qualified and responsible bidder(s) meeting RFP requirements; the City qualifies multiple responsive, qualified and experienced contractors. Bidders' qualifications (5 years' experience, equipment, personnel, financials, references) are investigated; a Pre-Bid Award Descope Meeting may be required. For projects with items on the Schedule of Unit Prices, DPW estimates project costs from submitted unit prices to determine the lowest bidder, but timeliness to schedule or complete the work is also a consideration, and the City reserves the right to award to any Contractor if in the City's best interest.",
      terminationConditions: "The City may terminate upon five (5) days' written notice if the contractor fails to observe any terms and conditions or if the City believes the contractor's ability to perform has been materially impaired (e.g., loss of insurance coverage, lapsing of surety bond, bankruptcy, appointment of a receiver); upon termination the contractor is entitled to just and equitable compensation for satisfactory work completed. Under the General Conditions, if the Contractor or a Subcontractor refuses or fails to prosecute the work with diligence to ensure completion within the specified time, or violates any other provision, the Owner may by written notice terminate the Contractor's right to proceed, take over and complete the work, and hold the Contractor and sureties liable for additional costs and liquidated damages. Failure to comply with insurance requirements is a material breach entitling the Owner to terminate or suspend immediately. Noncompliance with Section 3 / equal opportunity requirements may result in cancellation, termination or suspension.",
      specifiedProducts: 'Named products (each "or approved equal"): Heavy Duty Round Frame and Cover – 32" — EJ Co. Product No. 00200694W03 (Cover) and 00200813 (Frame); Chute Frame and Cover — EJ Product No. 801144B01; Frame and Grate — EJ Product Nos. 5520002C01, 5520002C02, 5520001C01 (standard/high capacity, 3 or 4 flange); Heavy Duty Manhole Frame and Cover – 24" — EJ Product 240834B01; Sidewalk Manhole Frame and Cover — EJ Product 1040081A02; Rectangular Frame and Grate — EJ Product 45660040; Flexible Porous Pavement — KBI Flexi-Pave HD2000 by K.I. Industries, Inc.; Traffic Separator Curb with Flexpost — Tough Curb XLP and MP Flex Post by Impact Recovery Systems; Flexible Delineator Post — City Post model EAC Channelizer Post by Pexco, LLC – Davidson Traffic Control Products; sidewalk imprint cure spray — Meadows CS309 or equivalent; traffic separator curb anchors — FG 300 Anchor Bolt and Drill Bit.',
      materialStandards: "All work shall be in accordance with the RIDOT Standard Specifications for Road and Bridge Construction, August 2025, with all revisions, and State and Federal Special Provisions, plus City of Providence Technical Specifications and Standard Details (RIDOT Standard Details, February 24, 2025 for all others). Named standards include ASTM A48 (gray iron castings), ASTM A536 (ductile iron), ASTM No. 57 aggregate, ASTM D4280 (reflectors), AASHTO M45-92 (masonry mortar sand), AASHTO M170 Class IV (RCP), AASHTO T180 modified Proctor density (95% compaction), MUTCD (latest edition), NCHRP Report 350 / MASH 2009, ADA requirements, RIGL Title 37 Chapter 13 prevailing wage, Davis-Bacon, and RIDOT Standard Specification Sections 100, 106.5, 105.06, 201, 202, 206, 212, 301, 401, 403, 501, 601, 603, 702, 704, 905, 906, 913, 914, 932, 935, M.01–M.04, M.09, M.18, L.01, L.02, L.06, T.11, T.18. Materials testing per the RIDOT Materials Testing and Certification Schedule and RIDOT Master Schedule for Sampling, Testing, and Certification of Materials, latest edition; Portland cement concrete Class XX(AE) 4,000 psi.",
