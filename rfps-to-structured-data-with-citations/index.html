    <style>
/* viz-kit.css — the /viz house style. Load with:
     <link rel="stylesheet" href="/_kit/viz-kit.css">
   Served by the viz server at /_kit/viz-kit.css from the skill's own kit/ dir.

   Why this exists: nearly every viz independently re-derived the same dark theme
   (a GitHub-dark palette), re-guessed the exact hexes (so the "same" background
   drifted across files), and invented its own variable names (--txt vs --text vs
   --ink) for identical concepts. This file fixes the palette and the names ONCE so
   you can reach for var(--accent) / var(--good) instead of re-picking colors.

   The dark GitHub-ish palette is the DEFAULT, not a constraint. Every rule below
   reads its colors through var() — there is not one hardcoded hex outside :root —
   so a page needing a brand or one-off palette overrides the tokens in a later
   :root and keeps every component. Re-theme; don't fork. See kit/README.md. */

:root {
  /* Surfaces, back to front */
  --bg: #0d1117;
  --panel: #161b22;
  --panel-2: #21262d;
  --border: #30363d;

  /* Text — three tiers. --faint is for de-emphasized chrome (axis ticks, units,
     footnotes, "n of m" counters); 72 vizzes re-derived a third tier by hand
     before it existed here, at half a dozen different grays. */
  --text: #e6edf3;
  --muted: #8b949e;
  --faint: #6e7681;

  /* Intent — accents that carry meaning */
  --accent: #58a6ff; /* primary / links / selection */
  --good: #3fb950; /* success / healthy / "yes" */
  --warn: #d29922; /* caution / pending */
  --danger: #f85149; /* error / blocked / "no" */

  /* Categorical ramp — visually separable hues for diagram categories / series.
     Use these when you need N separable colors, NOT meaning.

     ⚠ ALIASING TRAP — c1/c2/c3/c6 are byte-identical to the intent colors above:
       --c1 == --accent   --c2 == --good   --c3 == --warn   --c6 == --danger
     So a categorical series rendered in --c2 reads as "success" next to anything
     using --good, and --c6 reads as "error". Only --c4, --c5, --c7, --c8 are
     unique to this ramp. This has already caused rework (a poster themed on --c2
     went monochrome against a --good meter and had to be re-themed to --c5).
     If your viz mixes categorical series WITH semantic color, pick from
     --c4/--c5/--c7/--c8 first, then reach for the aliased four knowingly.

     The four aliased slots are DEFINED AS the intent colors rather than repeating
     their hexes. That's deliberate: the aliasing is self-evident wherever you read
     this file, it cannot drift, and a re-theme keeps them in sync automatically.
     The slots with a literal hex are the meaning-free ones. */
  --c1: var(--accent); /* blue  — ALIAS, reads as "primary/selected" */
  --c2: var(--good); /* green — ALIAS, reads as "success" */
  --c3: var(--warn); /* amber — ALIAS, reads as "caution" */
  --c4: #bc8cff; /* purple — meaning-free */
  --c5: #4ec9b0; /* teal   — meaning-free */
  --c6: var(--danger); /* red — ALIAS, reads as "error" */
  --c7: #5d52b4; /* indigo  — meaning-free (ΔE 21.3 from the nearest intent color) */
  --c8: #b70385; /* magenta — meaning-free (ΔE 20.9) */
  /* No orange slot exists on purpose: every orange sits between --danger (hue 27°)
     and --warn (80°), and none clears ΔE 15 from both under CVD simulation. The
     obvious #f0883e is ΔE 1.5 from --warn to a protanope — indistinguishable. */

  /* Type */
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

  /* Spacing rhythm */
  --r: 8px;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  height: 100%;
}
html {
  /* Paint the canvas itself. body is height:100% (one viewport), so on a page taller
     than the viewport the area BELOW the body box would otherwise reveal the browser's
     default (lighter) canvas when scrolled — showing as a horizontal "line" mid-page
     where body's --bg ends. Putting --bg on the root keeps the whole canvas dark. */
  background-color: var(--bg);
}

body {
  /* A faint top-glow over the flat background — the recurring "radial-gradient at
     60% 0%" idiom, standardized. Sized large and faded to transparent well past the
     fold (color-mix dilutes --panel) so the glow→--bg transition never forms a
     visible edge mid-page — the earlier tight 600px gradient left a "boundary" band. */
  background:
    radial-gradient(
      1600px 1000px at 50% -30%,
      color-mix(in srgb, var(--panel) 55%, transparent),
      transparent 75%
    ),
    var(--bg);
  color: var(--text);
  font: 14px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* Links. There was no bare `a` rule here until 2026-08-19, so every naked anchor
   in every viz fell through to the user-agent default: #0000EE on a #0d1117
   background (2.3:1 — below the 4.5:1 floor), and #551A8B once visited, which is
   1.5:1 and effectively invisible. Both tiers now come from tokens, so they follow
   a re-theme. --c4 keeps the "visited is purple" convention at 8.2:1 instead of
   abandoning it. Lowest possible specificity, so any component rule still wins. */
a {
  color: var(--accent);
  text-underline-offset: 3px;
  text-decoration-thickness: 1px;
}
a:visited {
  color: var(--c4);
}
a:hover {
  color: var(--text);
  text-decoration-thickness: 2px;
}
a:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 3px;
}

/* Header: title + one-line muted subtitle — the chrome ~19/22 vizzes open with. */
.viz-header {
  padding: 20px 24px;
}
.viz-header h1 {
  margin: 0;
  font-size: 20px;
  font-weight: 650;
  letter-spacing: -0.01em;
}
.viz-header .sub,
.sub {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 12.5px;
}

/* Panels / cards */
.panel,
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: calc(var(--r) * 1.5);
  padding: 16px;
}

/* Slide-in detail drawer (click a node → details). Toggle .open. */
.drawer {
  position: fixed;
  top: 0;
  right: 0;
  height: 100%;
  width: min(420px, 90vw);
  background: var(--panel);
  border-left: 1px solid var(--border);
  transform: translateX(100%);
  transition: transform 0.2s ease;
  overflow: auto;
  padding: 20px;
  z-index: 50;
}
.drawer.open {
  transform: none;
}

/* Legend: the single most common component (~16/22), reinvented differently each
   time. Two swatch shapes: a filled square for nodes, a short rule for edge types. */
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  font-size: 12px;
  color: var(--muted);
}
.legend-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.swatch {
  width: 12px;
  height: 12px;
  border-radius: 3px;
  flex: none;
  background: var(--accent);
}
/* Colour comes from `background` (inherited from .swatch), NOT border-top. It was
   `height:0` + `border-top` until 2026-08-19, which made the documented way to
   colour a swatch — an inline `background:` — a silent no-op: every line swatch in
   the corpus rendered accent-blue regardless of what it was labelling. All 5
   usages passed `background`; none passed `border-top-color`. */
.swatch.line {
  width: 16px;
  height: 2px;
  border-radius: 0;
}
/* Round swatch. Its absence is why 25 vizzes abandoned .swatch entirely and
   hand-rolled a .dot/.sw at five different sizes — the shape was the blocker,
   not the component. */
.swatch.dot {
  border-radius: 50%;
}

/* Status / label pill — uppercase micro-badge. Recurs in ~120 files (the
   border-radius:999px + text-transform:uppercase idiom) and was re-derived at a
   different size almost every time. Modifiers tint text + border together. */
.pill {
  display: inline-block;
  font: 700 11px var(--sans);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 999px;
  border: 1px solid var(--border);
  color: var(--muted);
  white-space: nowrap;
}
.pill.accent {
  color: var(--accent);
  border-color: color-mix(in srgb, var(--accent) 50%, transparent);
}
.pill.good {
  color: var(--good);
  border-color: color-mix(in srgb, var(--good) 50%, transparent);
}
.pill.warn {
  color: var(--warn);
  border-color: color-mix(in srgb, var(--warn) 50%, transparent);
}
.pill.danger {
  color: var(--danger);
  border-color: color-mix(in srgb, var(--danger) 50%, transparent);
}

/* Animated "flow" edge — dashed line whose dashes drift along the path. The
   @keyframes was identical everywhere but for the offset magnitude; here it's one
   class. Apply to an SVG <path>/<line>: <path class="flow" .../>. */

      fields: {
        title: "Sidewalk, Road, Bridge, and Drainage Construction (Blanket Contract 2026)",
        issuer: "City of Providence, Rhode Island — Board of Contract and Supply; issuing department: Department of Public Works",
        issuerContact: "Bryant Anderson, Deputy Chief Engineer, Engineering Division, Department of Public Works (technical/specification questions); Grace Diaz, MBE/WBE Outreach Director (MBE/WBE forms); Purchasing Department (process questions)",
        issuerEmail: "banderson@providenceri.gov (specifications); purchasing@providenceri.gov (process); gdiaz@providenceri.gov (MBE/WBE forms)",
        solicitationNumber: "Procurement/MinuteTraq #: 52281",
        intent: "The City of Providence Department of Public Works seeks to qualify multiple contractors under a blanket contract to perform sidewalk, road, bridge, drainage and other similar construction within the public right-of-way or other City-owned areas as funding opportunities and needs arise, with work assigned by Task Order.",
        scope: "Work is divided into two categories: 1) Sidewalk, Road, and Drainage Construction — full frontage sidewalk repairs, spot sidewalk repairs, utility patch restorations (road and sidewalk), full depth road restoration including granular and rigid base, minor milling/paving, drainage work including catch basin/manhole repairs, installation of speed lumps/raised crosswalks; and 2) Bridge Construction — bridge construction, maintenance and repairs. Also includes restoration of roadway striping and traffic detection loops and all incidentals.",
        submissionDeadline: "Monday, March 9, 2026 at 2:15 P.M. (bids publicly opened at 2:15 P.M.)",
        questionsDeadline: "2:00 pm on Tuesday, February 24, 2026",
        contractTerm: "Runs through December 31, 2027, with three (3) one-year renewal options (1/1/2028–12/31/2028, 1/1/2029–12/31/2029, and 1/1/2030–12/31/2030), exercisable upon mutual agreement of the parties.",
        estimatedValue: null,
        eligibleApplicants: "Qualified and responsible contractors with at least 5 years construction experience within the last 7 years on Roadway and/or Bridge Improvement Projects; out-of-state corporations must be registered to transact business in Rhode Island. MBE/WBE participation goals (20% combined) apply to Task Orders, and MBE/WBE firms are actively sought.",
        submissionMethod: "Physical delivery of sealed bids to the Department of the City Clerk, City Hall Room 311, 25 Dorrance Street, Providence, RI 02903 — 2 copies (one original and one paper copy) in sealed, labeled envelopes plus an electronic copy in .PDF format on a USB flash drive. No CDs or emailed PDFs accepted.",
        evaluationCriteria: "Award to the lowest qualified and responsible bidder(s) meeting RFP requirements; the City qualifies multiple responsive, qualified and experienced contractors. Bidders' qualifications (5 years' experience, equipment, personnel, financials, references) are investigated; a Pre-Bid Award Descope Meeting may be required. For projects with items on the Schedule of Unit Prices, DPW estimates project costs from submitted unit prices to determine the lowest bidder, but timeliness to schedule or complete the work is also a consideration, and the City reserves the right to award to any Contractor if in the City's best interest.",
        terminationConditions: "The City may terminate upon five (5) days' written notice if the contractor fails to observe any terms and conditions or if the City believes the contractor's ability to perform has been materially impaired (e.g., loss of insurance coverage, lapsing of surety bond, bankruptcy, appointment of a receiver); upon termination the contractor is entitled to just and equitable compensation for satisfactory work completed. Under the General Conditions, if the Contractor or a Subcontractor refuses or fails to prosecute the work with diligence to ensure completion within the specified time, or violates any other provision, the Owner may by written notice terminate the Contractor's right to proceed, take over and complete the work, and hold the Contractor and sureties liable for additional costs and liquidated damages. Failure to comply with insurance requirements is a material breach entitling the Owner to terminate or suspend immediately. Noncompliance with Section 3 / equal opportunity requirements may result in cancellation, termination or suspension.",
        specifiedProducts: 'Named products (each "or approved equal"): Heavy Duty Round Frame and Cover – 32" — EJ Co. Product No. 00200694W03 (Cover) and 00200813 (Frame); Chute Frame and Cover — EJ Product No. 801144B01; Frame and Grate — EJ Product Nos. 5520002C01, 5520002C02, 5520001C01 (standard/high capacity, 3 or 4 flange); Heavy Duty Manhole Frame and Cover – 24" — EJ Product 240834B01; Sidewalk Manhole Frame and Cover — EJ Product 1040081A02; Rectangular Frame and Grate — EJ Product 45660040; Flexible Porous Pavement — KBI Flexi-Pave HD2000 by K.I. Industries, Inc.; Traffic Separator Curb with Flexpost — Tough Curb XLP and MP Flex Post by Impact Recovery Systems; Flexible Delineator Post — City Post model EAC Channelizer Post by Pexco, LLC – Davidson Traffic Control Products; sidewalk imprint cure spray — Meadows CS309 or equivalent; traffic separator curb anchors — FG 300 Anchor Bolt and Drill Bit.',
        materialStandards: "All work shall be in accordance with the RIDOT Standard Specifications for Road and Bridge Construction, August 2025, with all revisions, and State and Federal Special Provisions, plus City of Providence Technical Specifications and Standard Details (RIDOT Standard Details, February 24, 2025 for all others). Named standards include ASTM A48 (gray iron castings), ASTM A536 (ductile iron), ASTM No. 57 aggregate, ASTM D4280 (reflectors), AASHTO M45-92 (masonry mortar sand), AASHTO M170 Class IV (RCP), AASHTO T180 modified Proctor density (95% compaction), MUTCD (latest edition), NCHRP Report 350 / MASH 2009, ADA requirements, RIGL Title 37 Chapter 13 prevailing wage, Davis-Bacon, and RIDOT Standard Specification Sections 100, 106.5, 105.06, 201, 202, 206, 212, 301, 401, 403, 501, 601, 603, 702, 704, 905, 906, 913, 914, 932, 935, M.01–M.04, M.09, M.18, L.01, L.02, L.06, T.11, T.18. Materials testing per the RIDOT Materials Testing and Certification Schedule and RIDOT Master Schedule for Sampling, Testing, and Certification of Materials, latest edition; Portland cement concrete Class XX(AE) 4,000 psi.",
        standardDetails: `Appendix D contains City of Providence Standard Details, indexed as: 6.1.1 P Sidewalk Manhole Frame and Cover; 6.1.2 P Chute Frame and Cover; 6.2.1 P Heavy Duty Manhole Frame and Cover - 24 Inch; 6.2.2 P Heavy Duty Manhole Frame and Cover - 32 Inch; 6.3.0 P Standard Capacity Grate; 6.3.3 P High Capacity Grate; 6.3.4 P High Capacity Grate and Three Flange Frame; 6.3.5 P High Capacity Grate and Four Flange Frame; 6.3.6 P Rectangular Frame and Grate; 7.3.0 P Granite Curb – Straight and Circular; 7.3.3 P Granite Wheelchair Ramp Transition Curb; 7.3.4 P Granite 2'-0" Radius Curb Return; 7.3.5 P Granite Inlet Stone - 30" Opening; 7.3.6 P Granite Inlet Stone – 24" Opening; 7.3.7 P Granite Apron Stone – 24" Opening; 7.3.8 P Granite Apron Stone – 30" Opening; 7.3.9 P Granite Ramp Stone; 7.6.0 P Curb Setting Detail; 43.1.0 P Cement Concrete Sidewalk; 43.1.1 P Sidewalk Removal Detail; 43.3.0 Wheelchair Ramp (RIDOT Standard); 43.3.1 Wheelchair Ramp for Limited Right-of-Way Areas; 43.3.2 Ramp-Landing for Narrow Sidewalk; 48.1.0 Detectable Warning Panel Placement; 43.5.0 P Cement Concrete Driveways; 43.6.0 P Compound Slope Sidewalk; 60.1.0 P Temporary Roadway Restoration; 60.2.1 P Permanent Roadway Restoration – Granular Base; 60.2.2 P Permanent Roadway Restoration – Concrete Base; 60.2.3 P Cobblestone Restoration – Granular Base; 60.4.0 P Inlet/Apron Stone Reveal; SL.1.0 P Speed Lumps.`,
        dimensionalRequirements: `Examples include: granite curbing 7 in. width, minimum 3'-0" lengths for straight/circular pieces, 6 inch curb reveal (min. 4 inches when matching existing); granite ramp stone 4'-0" minimum length, 18" height; 4 inch Portland cement concrete sidewalks and 8 inch concrete driveways/wheelchair ramps (4,000 psi), control joints every 5 feet, expansion joints every 20 feet; sidewalk minimum 5'-0" width (ADA clear width 36 in. at pinch points, 48 in. continuous elsewhere); cross slope max 2% (1:50) and running slope max 8.33% (1:12); compound slope sidewalk requires 7 ft min. width, 5 ft min. accessible route, ≥2 ft compound section; travel lane minimum 11 feet wide; pedestrian way 5 feet unobstructed clear width; welded wire mesh 6"x6"-W4xW4 set 3" below driveway surface; 8 inch minimum rigid concrete base with 5/8" epoxy-coated #5 dowels 24" long at 18" on center; permanent restoration extends 1 ft beyond limits of excavation, trench width D+2'-0"; temporary patch 3" HMA; parking meters set with bottom ~37 inches and display ~54 inches (4.5 ft) above grade; flexible delineator posts 3 in. diameter, 36 in. high with two 3 in. retroreflective bands and 4" deep anchor cup; traffic separator curb modular unit 40"L x 8"W x 2"H with 36"H x 3" dia. flexpost; flexible porous pavement 2 in. finished thickness over 4 in. aggregate base; tree removals measured 24 inches above grade, stumps ground 18 inches below grade; loam borrow and pine bark mulch 4 inches deep; detectable warning panel 24" depth matching ramp width; horizontal sawcut running slope not exceeding 1v:12h nor less than 1v:14h; sidewalk sawcut 6 inches (minimum) from face of adjacent buildings/walls/fences.`,
        castMarkings: 'Manhole/catch basin castings are specified only by manufacturer product number, but cast lettering appears on the detail sheets as follows — Sidewalk Manhole Frame and Cover (Std. 6.1.1 P): "CITY OF PROVIDENCE", "MADE IN USA", "ASTM A48 CL35B", "MO/DA/YR X", "PROD. NO."; Chute Frame and Cover (Std. 6.1.2 P): "CITY OF PROVIDENCE", "MADE IN USA"; Heavy Duty Manhole Frame and Cover – 24 Inch (Std. 6.2.1 P): "CITY OF PROVIDENCE", "MADE IN USA", "NO DUMPING X", "PROD NO", "ASTM A48 CL35B" with 1" lettering; Heavy Duty Manhole Frame and Cover – 32 Inch (Std. 6.2.2 P): "CITY OF PROVIDENCE", "MADE IN USA", "ASTM A48 CL35B", "PROD. NO", "MO/DA/YR X" with 2" lettering; Standard Capacity Grate (Std. 6.3.0 P): "DRAINS TO WATERWAYS", "DUMP NO WASTE!", "CITY OF PROVIDENCE", "MADE IN USA", "ASTM A536", "PROD. NO.", "MO/D/YR X" in 3/8" flat face gothic; High Capacity Grate (Std. 6.3.3 P): "MADE IN USA", "CITY OF PROVIDENCE", "DRAINS TO WATERWAYS", "DUMP NO WASTE", "FLOW", "PROD. NO.", "MO/DY/YR X", "ASTM A536", "L24SG18DI" with 3/8" recessed lettering; High Capacity Grate and Three/Four Flange Frame (Std. 6.3.4 P / 6.3.5 P): "CITY OF PROVIDENCE", "DRAINS TO WATERWAYS", "DUMP NO WASTE", "MADE IN USA", "FLOW", "ASTM A48 CL35B", "PROD. NO.", "MO/DY/YR X" with 1/2" recessed lettering; Rectangular Frame and Grate (Std. 6.3.6 P): "DUMP NO WASTE!", "MADE IN USA", "DRAINS TO WATERWAYS", "MO/DA/YR" with 1/2" letters and a fish logo.'
