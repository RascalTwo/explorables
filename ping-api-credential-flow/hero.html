<title>PingOne Self-Service API Credential Flow — hero</title>
<div class="og-card">

  <!-- ambient background: phase glows + faint swimlane lifelines -->
  <div class="bg-glow"></div>
  <svg class="lifelines" viewBox="0 0 1200 630" preserveAspectRatio="none" aria-hidden="true">
    <g stroke="#39435a" stroke-width="1.4" stroke-dasharray="3 5" opacity="0.5">
      <line x1="150" y1="0" x2="150" y2="630"/>
      <line x1="360" y1="0" x2="360" y2="630"/>
      <line x1="570" y1="0" x2="570" y2="630"/>
      <line x1="780" y1="0" x2="780" y2="630"/>
      <line x1="990" y1="0" x2="990" y2="630"/>
      <line x1="1050" y1="0" x2="1050" y2="630"/>
    </g>
  </svg>

  <div class="content">

    <!-- top rail: wordmark + endpoint -->
    <div class="toprail">
      <div class="brand">
        <span class="brand-mark"></span>
        <span class="brand-name">PingOne</span>
        <span class="brand-sub">· MANAGEMENT API</span>
      </div>
      <div class="endpoint">
        <span class="lock"></span>api.pingone.com&#8202;/&#8202;as&#8202;/&#8202;token
      </div>
    </div>

    <!-- title block -->
    <div class="titleblock">
      <div class="eyebrow">DYNAMIC CLIENT REGISTRATION</div>
      <h1>
        <span class="t1">Self-Service API</span>
        <span class="t2">Credential Flow</span>
      </h1>
      <p class="essence">
        An API consumer self-provisions credentials, mints an access token,
        and calls a protected API &mdash; with zero manual admin work.
      </p>
    </div>

    <!-- focal motif: the three-phase credential relay -->
    <div class="relay">
      <svg viewBox="0 0 1080 232" width="1080" height="232" aria-hidden="true">
        <defs>
          <marker id="ah-g" markerWidth="10" markerHeight="10" refX="6.5" refY="3.2" orient="auto">
            <path d="M0,0 L7.5,3.2 L0,6.4 Z" fill="#34d399"/></marker>
          <marker id="ah-b" markerWidth="10" markerHeight="10" refX="6.5" refY="3.2" orient="auto">
            <path d="M0,0 L7.5,3.2 L0,6.4 Z" fill="#60a5fa"/></marker>
          <marker id="ah-p" markerWidth="10" markerHeight="10" refX="6.5" refY="3.2" orient="auto">
            <path d="M0,0 L7.5,3.2 L0,6.4 Z" fill="#a78bfa"/></marker>
        </defs>

        <!-- baseline lifeline the nodes ride on -->
        <line x1="24" y1="118" x2="1056" y2="118" stroke="#2a3142" stroke-width="1.5" stroke-dasharray="2 6"/>

        <!-- connector 1: register -> token -->
        <line x1="288" y1="118" x2="404" y2="118" stroke="#34d399" stroke-width="2.4" marker-end="url(#ah-g)"/>
        <text x="346" y="102" text-anchor="middle" class="wire wire-g">client_id · secret</text>
        <!-- connector 2: token -> call -->
        <line x1="676" y1="118" x2="792" y2="118" stroke="#60a5fa" stroke-width="2.4" marker-end="url(#ah-b)"/>
        <text x="734" y="102" text-anchor="middle" class="wire wire-b">access_token · JWT</text>

        <!-- NODE 1 — REGISTER (green / provision) -->
        <g>
          <rect x="24" y="44" width="264" height="148" rx="16" fill="#131722" stroke="#34d399" stroke-opacity="0.45" stroke-width="1.5"/>
          <rect x="24" y="44" width="264" height="4" rx="2" fill="#34d399"/>
          <circle cx="52" cy="80" r="13" fill="#34d399"/>
          <text x="52" y="85" text-anchor="middle" class="badge">1</text>
          <text x="76" y="76" class="phase phase-g">PHASE 1</text>
          <text x="76" y="90" class="phase-sub">PROVISION</text>
          <text x="40" y="130" class="node-title">REGISTER</text>
          <text x="40" y="158" class="node-mono">POST /clients · resource</text>
          <text x="40" y="176" class="node-mono dim">+ scope · attributes · grant</text>
        </g>

        <!-- NODE 2 — TOKEN (blue / mint) -->
        <g>
          <rect x="412" y="44" width="264" height="148" rx="16" fill="#131722" stroke="#60a5fa" stroke-opacity="0.45" stroke-width="1.5"/>
          <rect x="412" y="44" width="264" height="4" rx="2" fill="#60a5fa"/>
          <circle cx="440" cy="80" r="13" fill="#60a5fa"/>
          <text x="440" y="85" text-anchor="middle" class="badge">2</text>
          <text x="464" y="76" class="phase phase-b">PHASE 2</text>
          <text x="464" y="90" class="phase-sub">MINT</text>
          <text x="428" y="130" class="node-title">TOKEN</text>
          <text x="428" y="158" class="node-mono">POST /as/token</text>
          <text x="428" y="176" class="node-mono dim">grant = client_credentials</text>
        </g>

        <!-- NODE 3 — CALL (purple / call) -->
        <g>
          <rect x="800" y="44" width="256" height="148" rx="16" fill="#131722" stroke="#a78bfa" stroke-opacity="0.45" stroke-width="1.5"/>
          <rect x="800" y="44" width="256" height="4" rx="2" fill="#a78bfa"/>
          <circle cx="828" cy="80" r="13" fill="#a78bfa"/>
          <text x="828" y="85" text-anchor="middle" class="badge">3</text>
          <text x="852" y="76" class="phase phase-p">PHASE 3</text>
          <text x="852" y="90" class="phase-sub">CALL</text>
          <text x="816" y="130" class="node-title">CALL</text>
          <text x="816" y="158" class="node-mono">GET /api/resource</text>
          <text x="816" y="176" class="node-mono ok">Bearer &lt;token&gt; &#8594; 200 OK</text>
        </g>
      </svg>
    </div>

  </div>
</div>
