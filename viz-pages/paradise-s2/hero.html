<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Paradise S2 — System Diagram (hero card)</title>
<style>
  :root {
    --bg: #07090d;
    --panel: #0e1219;
    --ink: #d8dde6;
    --dim: #6a7280;
    --muted: #444a55;
    --a-line: #4a5468;
    --b-line: #c8954a;
    --alex: #b7373a;
    --seam: #e84545;
    --node-a: #2a2f3a;
    --node-b: #2a2218;
    --card: #f1d27a;
    --redact: #2c3341;
    --redact-b: #3a3016;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #04050a; }

  .og-card {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background:
      radial-gradient(ellipse 900px 560px at 66% 44%, #141b2b 0%, #0a0d15 46%, #07090d 74%),
      #07090d;
    color: var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  /* faint full-card blueprint grid */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(74,84,104,0.055) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(74,84,104,0.055) 1px, transparent 1px);
    background-size: 40px 40px;
    background-position: -1px -1px;
    pointer-events: none;
  }
  /* subtle vignette to seat everything */
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 1200px 700px at 50% 46%, transparent 55%, rgba(0,0,0,0.55) 100%);
    pointer-events: none;
  }

  /* corner registration ticks — editorial schematic frame */
  .tick { position: absolute; width: 22px; height: 22px; opacity: 0.5; }
  .tick::before, .tick::after { content: ""; position: absolute; background: var(--a-line); }
  .tick::before { width: 22px; height: 1px; }
  .tick::after  { width: 1px;  height: 22px; }
  .tick.tl { top: 30px; left: 30px; }
  .tick.tl::before { top: 0; left: 0; } .tick.tl::after { top: 0; left: 0; }
  .tick.br { bottom: 30px; right: 30px; }
  .tick.br::before { bottom: 0; right: 0; } .tick.br::after { bottom: 0; right: 0; }

  /* ===================== LEFT — editorial title block ===================== */
  .copy {
    position: absolute;
    left: 64px; top: 0; height: 100%;
    width: 430px;
    display: flex; flex-direction: column; justify-content: center;
    z-index: 3;
  }
  .eyebrow {
    font-size: 12px; letter-spacing: 0.34em; text-transform: uppercase;
    color: var(--dim); display: flex; align-items: center; gap: 12px;
    margin-bottom: 26px;
  }
  .eyebrow .bar { width: 34px; height: 1px; background: var(--alex); flex: none; }

  .title {
    font-size: 82px; line-height: 0.92; font-weight: 700;
    letter-spacing: 0.02em; color: #f2f3f6; text-transform: uppercase;
  }
  .title .accent { color: var(--alex); }

  .season {
    margin-top: 16px;
    font-size: 15px; letter-spacing: 0.30em; text-transform: uppercase;
    color: var(--b-line); font-weight: 600;
    display: flex; align-items: center; gap: 13px;
  }
  .season .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--b-line); }

  .rule { margin-top: 26px; width: 62px; height: 2px; background: var(--a-line); opacity: 0.7; }

  .essence {
    margin-top: 26px;
    font-size: 15.5px; line-height: 1.62; color: #aeb4c0; letter-spacing: 0.005em;
    max-width: 388px;
  }
  .essence b { color: var(--ink); font-weight: 600; }

  .badge {
    margin-top: 34px;
    align-self: flex-start;
    display: inline-flex; align-items: center; gap: 9px;
    padding: 9px 15px;
    border: 1px solid rgba(232,69,69,0.42);
    border-radius: 3px;
    background: linear-gradient(180deg, rgba(232,69,69,0.14), rgba(183,55,58,0.06));
    color: #f2b0b1;
    font-size: 12px; letter-spacing: 0.24em; text-transform: uppercase; font-weight: 600;
    box-shadow: 0 0 0 1px rgba(232,69,69,0.05), 0 6px 22px rgba(183,55,58,0.14);
  }
  .badge .warn { font-size: 14px; filter: saturate(1.1); }

  /* hairline divider between copy and schematic */
  .divider {
    position: absolute; left: 528px; top: 84px; bottom: 84px; width: 1px;
    background: linear-gradient(to bottom, transparent, rgba(74,84,104,0.55) 18%, rgba(74,84,104,0.55) 82%, transparent);
    z-index: 2;
  }

  /* ===================== RIGHT — redacted schematic panel ===================== */
  .schematic {
    position: absolute;
    left: 566px; top: 78px;
    width: 570px; height: 474px;
    border: 1px solid #1c2230;
    border-radius: 5px;
    background: linear-gradient(180deg, rgba(20,26,38,0.42), rgba(8,11,17,0.42));
    overflow: hidden;
    z-index: 2;
    box-shadow: inset 0 0 60px rgba(0,0,0,0.5), 0 20px 60px rgba(0,0,0,0.45);
  }
  .schematic .cap {
    position: absolute; z-index: 4;
    font-size: 10.5px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted);
  }
  .cap.fig { top: 14px; left: 16px; color: var(--dim); }
  .cap.red { top: 14px; right: 16px; color: #8a5b5c; display: flex; align-items: center; gap: 7px; }
  .cap.red .sq { width: 22px; height: 8px; background: var(--redact); border-radius: 1px; }
  .cap.foot { bottom: 13px; left: 16px; color: var(--muted); }

  .schematic svg { position: absolute; inset: 0; width: 100%; height: 100%; }

  @keyframes pulse {
    0%, 100% { opacity: 0.9;  transform: scale(1); }
    50%      { opacity: 1;    transform: scale(1.06); }
  }
  .alex-pulse { transform-box: fill-box; transform-origin: center; animation: pulse 3.4s ease-in-out infinite; }
  @keyframes seam-flash { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
  .seam { animation: seam-flash 2.4s ease-in-out infinite; }
</style>
</head>
<body>
  <div class="og-card">
    <div class="grid"></div>

    <span class="tick tl"></span>
    <span class="tick br"></span>

    <!-- ================= LEFT COPY ================= -->
    <div class="copy">
      <div class="eyebrow"><span class="bar"></span>The plot, drawn as a machine</div>
      <div class="title">Para<span class="accent">dise</span></div>
      <div class="season"><span class="dot"></span>Season Two · System View</div>
      <div class="rule"></div>
      <p class="essence">
        Every thread of the season mapped as <b>one diagram</b> — the timelines, the machine at the center, and the moves it's been making all along.
      </p>
      <div class="badge"><span class="warn">⚠️</span>S2 Spoilers Inside</div>
    </div>

    <div class="divider"></div>

    <!-- ================= RIGHT SCHEMATIC (abstract / redacted) ================= -->
    <div class="schematic">
      <div class="cap fig">Fig.01 — System Map</div>
      <div class="cap red"><span class="sq"></span>Redacted</div>
      <div class="cap foot">Labels withheld · full map inside</div>

      <svg viewBox="0 0 570 474" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <radialGradient id="core" cx="50%" cy="50%" r="50%">
            <stop offset="0%"   stop-color="#ff5b5e" stop-opacity="0.95"/>
            <stop offset="45%"  stop-color="#b7373a" stop-opacity="0.5"/>
            <stop offset="100%" stop-color="#b7373a" stop-opacity="0"/>
          </radialGradient>
          <marker id="aArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="#b7373a"/>
          </marker>
          <pattern id="mesh" width="38" height="38" patternUnits="userSpaceOnUse">
            <path d="M 38 0 L 0 0 0 38" fill="none" stroke="#111722" stroke-width="0.6"/>
          </pattern>
        </defs>

        <rect width="570" height="474" fill="url(#mesh)"/>

        <!-- ===== TOP LANE (A — cool, dashed, suppressed) ===== -->
        <line x1="48" y1="96" x2="522" y2="96" stroke="#4a5468" stroke-width="1.5" stroke-dasharray="2 5"/>
        <g>
          <!-- node A1 -->
          <circle cx="120" cy="96" r="10" fill="#2a2f3a" stroke="#4a5468" stroke-width="1.5"/>
          <rect x="98"  y="66" width="44" height="7" rx="2" fill="#2c3341"/>
          <!-- node A2 : removed/crossed (abstract) -->
          <circle cx="290" cy="96" r="9" fill="#2a2f3a" stroke="#4a5468" stroke-width="1.5"/>
          <line x1="284" y1="90" x2="296" y2="102" stroke="#7d4144" stroke-width="1.5"/>
          <line x1="284" y1="102" x2="296" y2="90" stroke="#7d4144" stroke-width="1.5"/>
          <rect x="270" y="66" width="40" height="7" rx="2" fill="#2c3341"/>
          <!-- node A3 : counterfactual, faded dashed -->
          <circle cx="470" cy="96" r="11" fill="#1c2029" stroke="#444a55" stroke-width="1.4" stroke-dasharray="2 3" opacity="0.6"/>
          <rect x="446" y="66" width="48" height="7" rx="2" fill="#22272f" opacity="0.7"/>
        </g>

        <!-- ===== BOTTOM LANE (B — gold, solid, lived) ===== -->
        <line x1="48" y1="384" x2="522" y2="384" stroke="#c8954a" stroke-width="2"/>
        <g>
          <circle cx="120" cy="384" r="11" fill="#2a2218" stroke="#c8954a" stroke-width="1.5"/>
          <rect x="96"  y="404" width="48" height="7" rx="2" fill="#3a3016"/>

          <circle cx="272" cy="384" r="11" fill="#2a2218" stroke="#c8954a" stroke-width="1.5"/>
          <rect x="248" y="404" width="48" height="7" rx="2" fill="#3a3016"/>

          <!-- built artifact (square) -->
          <rect x="384" y="373" width="24" height="22" fill="#2a0d0f" stroke="#c8954a" stroke-width="1.4"/>
          <rect x="372" y="404" width="48" height="7" rx="2" fill="#3a3016"/>

          <circle cx="470" cy="384" r="11" fill="#2a2218" stroke="#c8954a" stroke-width="1.5"/>
          <rect x="446" y="404" width="48" height="7" rx="2" fill="#3a3016"/>
        </g>

        <!-- ===== MID TRACK — seam dots (visible seams) ===== -->
        <path d="M 60 240 L 510 240" stroke="#6a7a90" stroke-width="1" stroke-dasharray="1 5" fill="none" opacity="0.5"/>
        <g>
          <circle class="seam" cx="150" cy="240" r="6" fill="#e84545"/>
          <circle cx="150" cy="240" r="12" fill="none" stroke="#e84545" stroke-width="1" opacity="0.35"/>
          <circle class="seam" cx="470" cy="240" r="5.5" fill="#e84545" style="animation-delay:-0.9s"/>
          <circle cx="470" cy="240" r="11" fill="none" stroke="#e84545" stroke-width="1" opacity="0.35"/>
        </g>

        <!-- ===== PAGE-SWAP ARCS (A -> B, redraft in progress) ===== -->
        <g stroke="#b7373a" stroke-width="1.2" fill="none" opacity="0.72">
          <path d="M 290 106 C 250 190, 180 300, 120 372" stroke-dasharray="4 4" marker-end="url(#aArrow)"/>
          <path d="M 470 108 C 452 200, 420 300, 400 366" stroke-dasharray="4 4" marker-end="url(#aArrow)"/>
        </g>

        <!-- ===== CENTER CORE (the machine — unlabeled, glowing) ===== -->
        <g transform="translate(285,240)">
          <circle class="alex-pulse" r="62" fill="url(#core)"/>
          <circle r="33" fill="#1a0709" stroke="#b7373a" stroke-width="2"/>
          <circle r="27" fill="none" stroke="#7a2123" stroke-width="1" stroke-dasharray="3 4"/>
          <circle r="17" fill="none" stroke="#ff8385" stroke-width="1" opacity="0.5"/>
          <!-- redacted core label -->
          <rect x="-22" y="-4" width="44" height="8" rx="2" fill="#521c1e"/>
        </g>

        <!-- ===== manipulation arrows: core -> seams ===== -->
        <g stroke="#b7373a" stroke-width="1" fill="none" opacity="0.5">
          <path d="M 250 226 C 210 218, 180 230, 158 238" stroke-dasharray="3 3" marker-end="url(#aArrow)"/>
          <path d="M 320 226 C 380 218, 430 230, 462 238" stroke-dasharray="3 3" marker-end="url(#aArrow)"/>
        </g>

        <!-- ===== endgame artifact (gold card, abstract) ===== -->
        <g transform="translate(500,300)">
          <rect x="-20" y="-13" width="40" height="26" rx="3" fill="#211a08" stroke="#f1d27a" stroke-width="1.4"/>
          <rect x="-11" y="-3.5" width="22" height="7" rx="2" fill="#5a4a1a"/>
        </g>
      </svg>
    </div>

    <div class="vignette"></div>
  </div>
</body>
</html>
