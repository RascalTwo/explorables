<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#2c3647;
    --ink:#e7ecf3; --dim:#9fb0c3; --accent:#58a6ff;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  html,body{ margin:0; background:#0d1117; }

  .og-card{
    width:1200px; height:630px; overflow:hidden;
    position:relative; display:flex;
    background:
      radial-gradient(1050px 720px at 8% -12%, rgba(88,166,255,.12), transparent 58%),
      radial-gradient(900px 760px at 108% 60%, rgba(107,88,54,.20), transparent 62%),
      var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  /* soft vignette so the edges settle */
  .og-card::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    box-shadow: inset 0 0 200px 40px rgba(0,0,0,.55);
  }

  /* ---------- LEFT COLUMN ---------- */
  .col-text{
    position:relative; z-index:2;
    width:640px; flex:none;
    padding:64px 40px 60px 72px;
    display:flex; flex-direction:column; justify-content:center;
  }

  .eyebrow{
    display:flex; align-items:center; gap:11px;
    font-size:15px; font-weight:700; letter-spacing:.22em;
    color:var(--dim); margin-bottom:26px;
  }
  .eyebrow .tick{
    width:11px; height:11px; border-radius:2px; flex:none;
    background:var(--accent); box-shadow:0 0 14px rgba(88,166,255,.8);
  }

  .title{ margin:0; line-height:.86; }
  .title .the{
    display:block; font-size:34px; font-weight:800; letter-spacing:.42em;
    color:var(--dim); margin-bottom:8px; padding-left:3px;
  }
  .title .big{
    display:block; font-size:132px; font-weight:800; letter-spacing:-.035em;
    color:var(--ink); text-transform:uppercase;
  }

  .tagline{
    margin:30px 0 0; max-width:480px;
    font-size:22px; line-height:1.42; font-weight:400; color:var(--dim);
  }
  .tagline em{ color:var(--ink); font-style:normal; font-weight:700; }

  .chapters{
    display:flex; flex-wrap:wrap; gap:0 12px; margin-top:40px;
    font-size:13px; letter-spacing:.06em; font-weight:600; color:#6b7688;
  }
  .chapters .ch{ position:relative; padding-right:12px; }
  .chapters .ch::after{
    content:""; position:absolute; right:0; top:50%; width:4px; height:4px;
    margin-top:-2px; border-radius:50%; background:#3a4457;
  }
  .chapters .ch:last-child{ padding-right:0; }
  .chapters .ch:last-child::after{ display:none; }
  .chapters .ch.on{ color:var(--accent); }

  /* ---------- RIGHT COLUMN (COURT) ---------- */
  .col-court{
    position:relative; z-index:1; flex:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px 40px 24px 8px;
    border-left:1px solid rgba(107,88,54,.28);
  }
  .court-wrap{
    filter: drop-shadow(0 22px 44px rgba(0,0,0,.55));
  }
  .court{ width:452px; height:auto; display:block; }

  .court-cap{
    margin-top:22px; font-size:13px; font-weight:700; letter-spacing:.24em;
    color:var(--dim);
  }
</style>
</head>
<body>
  <div class="og-card">

    <!-- ================= LEFT: EDITORIAL TYPE ================= -->
    <div class="col-text">
      <div class="eyebrow">
        <span class="tick"></span>
        A SIGNATURE MOVE&nbsp;&middot;&nbsp;BROKEN DOWN FIVE WAYS
      </div>

      <h1 class="title">
        <span class="the">THE</span>
        <span class="big">EURO</span>
        <span class="big">STEP</span>
      </h1>

      <p class="tagline">
        Two legal steps, in <em>two directions</em> — one to make the
        defender commit, one to slip past for the layup.
      </p>

      <div class="chapters">
        <span class="ch on">The&nbsp;Move</span>
        <span class="ch">Why&nbsp;It&nbsp;Works</span>
        <span class="ch">Rookie&nbsp;vs&nbsp;Pro</span>
        <span class="ch">3D&nbsp;View</span>
        <span class="ch">Footwork</span>
      </div>
    </div>

    <!-- ================= RIGHT: COURT + ZIG-ZAG MOTIF ================= -->
    <div class="col-court">
      <div class="court-wrap">
        <svg class="court" viewBox="0 0 500 490" aria-label="Top-down half court showing the euro-step path">
          <defs>
            <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#2b2010"/>
              <stop offset="1" stop-color="#1c1409"/>
            </linearGradient>
            <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
              <feGaussianBlur stdDeviation="6" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>

          <!-- floor + paint + arcs (redrawn from the viz's own court) -->
          <rect x="20" y="20" width="460" height="450" rx="8" fill="url(#wood)" stroke="#6b5836" stroke-width="2"/>
          <rect x="170" y="20" width="160" height="190" fill="#3a2b14" stroke="#6b5836" stroke-width="2"/>
          <circle cx="250" cy="210" r="60" fill="none" stroke="#6b5836" stroke-width="2"/>
          <path d="M 210 60 A 40 40 0 0 0 290 60" fill="none" stroke="#6b5836" stroke-width="2"/>
          <path d="M 55 20 L 55 145 A 215 215 0 0 0 445 145 L 445 20" fill="none" stroke="#6b5836" stroke-width="2"/>
          <line x1="225" y1="42" x2="275" y2="42" stroke="#cbb78a" stroke-width="5"/>
          <circle cx="250" cy="56" r="9" fill="none" stroke="#ff7a3c" stroke-width="3.5"/>

          <!-- defender momentum: committed to the fake side -->
          <line x1="286" y1="204" x2="330" y2="196" stroke="#e2493f" stroke-width="3" opacity="0.55"
                marker-end="url(#mom)" stroke-linecap="round"/>
          <defs>
            <marker id="mom" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M0,0 L10,5 L0,10 z" fill="#e2493f"/>
            </marker>
          </defs>

          <!-- THE EURO-STEP PATH — the signature zig-zag (viz keyframes) -->
          <path class="pathGlow" d="M150 430 L222 250 L305 200 L188 130 L232 78"
                fill="none" stroke="#58a6ff" stroke-width="9" opacity="0.28" filter="url(#glow)"/>
          <path class="pathLine" d="M150 430 L222 250 L305 200 L188 130 L232 78"
                fill="none" stroke="#58a6ff" stroke-width="3.5" stroke-dasharray="7 7"
                stroke-linecap="round" stroke-linejoin="round"/>

          <!-- gather marker -->
          <g transform="translate(222 250)">
            <circle r="10" fill="#15110a" stroke="#7d8aa0" stroke-width="2" stroke-dasharray="3 3"/>
            <text y="4" text-anchor="middle" font-size="12" font-weight="700" fill="#9fb0c3">&#8853;</text>
            <text x="-16" y="4" text-anchor="end" font-size="12.5" fill="#9fb0c3" font-weight="600">gather</text>
          </g>

          <!-- step 1 (fake side) -->
          <g transform="translate(305 200)">
            <circle r="14" fill="#0d1117" stroke="#58a6ff" stroke-width="3"/>
            <text y="5" text-anchor="middle" font-size="16" font-weight="800" fill="#58a6ff">1</text>
            <text x="20" y="5" font-size="12.5" fill="#9fb0c3" font-weight="600">fake</text>
          </g>

          <!-- step 2 (cross the other way) -->
          <g transform="translate(188 130)">
            <circle r="14" fill="#0d1117" stroke="#58a6ff" stroke-width="3"/>
            <text y="5" text-anchor="middle" font-size="16" font-weight="800" fill="#58a6ff">2</text>
            <text x="-20" y="5" text-anchor="end" font-size="12.5" fill="#9fb0c3" font-weight="600">cross</text>
          </g>

          <!-- ball-handler (start) -->
          <g transform="translate(150 430)">
            <circle r="15" fill="#36c98f" stroke="#073d2a" stroke-width="2"/>
            <text y="5" text-anchor="middle" font-size="14" font-weight="800" fill="#06231a">O</text>
          </g>

          <!-- defender (beaten to the fake side) -->
          <g transform="translate(282 205)">
            <circle r="14" fill="#e2493f" stroke="#3a0f0c" stroke-width="2"/>
            <text y="5" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">D</text>
          </g>

          <!-- the finish: ball up at the rim, far side -->
          <g transform="translate(232 78)">
            <circle r="10" fill="none" stroke="#36c98f" stroke-width="2.5"/>
            <circle r="6" fill="#ff9b3c" stroke="#7a3c00" stroke-width="1.5"/>
          </g>
        </svg>
      </div>
      <div class="court-cap">TWO STEPS &middot; TWO DIRECTIONS &middot; BUCKET</div>
    </div>

  </div>
</body>
</html>
