<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ansible vs Terraform — hero</title>
</head>
<body style="margin:0;background:#05070a;">

<div class="og-card" style="
  width:1200px;height:630px;overflow:hidden;position:relative;
  background:#0d1117;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  color:#e6edf3;">

  <!-- subtle technical dot-grid texture -->
  <div style="position:absolute;inset:0;
    background-image:radial-gradient(circle, rgba(139,148,158,0.055) 1px, transparent 1.4px);
    background-size:27px 27px;"></div>
  <!-- focal glow behind quadrant -->
  <div style="position:absolute;top:50%;right:290px;width:640px;height:640px;transform:translateY(-50%);
    background:radial-gradient(circle at 38% 40%, rgba(163,113,247,0.16), transparent 60%),
               radial-gradient(circle at 66% 66%, rgba(248,81,73,0.14), transparent 60%);
    filter:blur(6px);"></div>
  <!-- top hairline accent -->
  <div style="position:absolute;top:0;left:0;right:0;height:4px;
    background:linear-gradient(90deg,#a371f7 0%,#a371f7 42%,#8b949e 50%,#f85149 58%,#f85149 100%);
    opacity:.9;"></div>

  <!-- ── layout ── -->
  <div style="position:absolute;inset:0;display:flex;align-items:stretch;">

    <!-- LEFT: type block -->
    <div style="width:512px;flex:0 0 512px;display:flex;flex-direction:column;justify-content:center;
      padding:0 40px 0 74px;box-sizing:border-box;position:relative;">

      <div style="font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;
        font-size:13px;letter-spacing:3.4px;color:#58a6ff;text-transform:uppercase;
        margin-bottom:26px;font-weight:600;">
        Infrastructure&nbsp;as&nbsp;Code · Decision&nbsp;map
      </div>

      <div style="font-weight:800;line-height:0.98;letter-spacing:-1.5px;">
        <div style="font-size:78px;color:#f85149;">Ansible</div>
        <div style="font-size:40px;color:#8b949e;font-weight:500;letter-spacing:0;
          margin:2px 0 2px 4px;">vs</div>
        <div style="font-size:78px;color:#a371f7;">Terraform</div>
      </div>

      <div style="font-size:17.5px;line-height:1.5;color:#8b949e;max-width:400px;margin-top:26px;">
        Place any task on two axes — provisioning vs. configuration,
        declarative vs. procedural — and see where each tool wins.
      </div>

      <div style="margin-top:30px;padding-top:18px;border-top:1px solid #30363d;
        font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;
        font-size:13px;letter-spacing:.3px;color:#8b949e;">
        <span style="color:#a371f7;font-weight:700;">Terraform</span> builds the house
        <span style="color:#484f58;">·</span>
        <span style="color:#f85149;font-weight:700;">Ansible</span> furnishes it
      </div>
    </div>

    <!-- RIGHT: signature quadrant motif -->
    <div style="flex:1;display:flex;align-items:center;justify-content:center;padding-right:34px;">
      <svg width="524" height="524" viewBox="0 0 520 520" role="img"
        aria-label="Two-axis positioning quadrant: Terraform upper-left, Ansible lower-right"
        style="display:block;">
        <defs>
          <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="7" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        <!-- plot backdrop -->
        <rect x="72" y="72" width="376" height="376" rx="12" fill="#11161d" stroke="#30363d" stroke-width="1.4"/>
        <!-- quadrant tints: upper-left = Terraform, lower-right = Ansible -->
        <rect x="72"  y="72"  width="188" height="188" fill="rgba(163,113,247,0.11)"/>
        <rect x="260" y="260" width="188" height="188" fill="rgba(248,81,73,0.11)"/>
        <rect x="260" y="72"  width="188" height="188" fill="rgba(255,255,255,0.012)"/>
        <rect x="72"  y="260" width="188" height="188" fill="rgba(255,255,255,0.012)"/>

        <!-- center cross -->
        <line x1="260" y1="72" x2="260" y2="448" stroke="#30363d" stroke-dasharray="4 5"/>
        <line x1="72" y1="260" x2="448" y2="260" stroke="#30363d" stroke-dasharray="4 5"/>

        <!-- diagonal of opposition -->
        <line x1="162" y1="147" x2="358" y2="335" stroke="#484f58" stroke-width="1.4" stroke-dasharray="2 6"/>

        <!-- axis labels -->
        <text x="260" y="50" text-anchor="middle" fill="#8b949e" font-size="12.5" letter-spacing="2.5"
          font-family="ui-monospace,monospace">▲ DECLARATIVE</text>
        <text x="260" y="484" text-anchor="middle" fill="#8b949e" font-size="12.5" letter-spacing="2.5"
          font-family="ui-monospace,monospace">▼ PROCEDURAL</text>
        <text transform="rotate(-90 34 260)" x="34" y="260" text-anchor="middle" fill="#8b949e"
          font-size="12.5" letter-spacing="2.5" font-family="ui-monospace,monospace">◀ PROVISIONING</text>
        <text transform="rotate(-90 486 260)" x="486" y="260" text-anchor="middle" fill="#8b949e"
          font-size="12.5" letter-spacing="2.5" font-family="ui-monospace,monospace">CONFIGURATION ▶</text>

        <!-- Terraform node (provisioning · declarative) -->
        <circle cx="162" cy="147" r="24" fill="rgba(163,113,247,0.18)"/>
        <circle cx="162" cy="147" r="9.5" fill="#a371f7" stroke="#fff" stroke-width="1.6" filter="url(#glow)"/>
        <text x="180" y="141" fill="#a371f7" font-size="19" font-weight="800">Terraform</text>
        <text x="180" y="160" fill="#8b949e" font-size="11.5"
          font-family="ui-monospace,monospace" letter-spacing=".4">provision · declarative</text>

        <!-- Ansible node (configuration · procedural) -->
        <circle cx="358" cy="335" r="24" fill="rgba(248,81,73,0.18)"/>
        <circle cx="358" cy="335" r="9.5" fill="#f85149" stroke="#fff" stroke-width="1.6" filter="url(#glow)"/>
        <text x="340" y="329" text-anchor="end" fill="#f85149" font-size="19" font-weight="800">Ansible</text>
        <text x="340" y="348" text-anchor="end" fill="#8b949e" font-size="11.5"
          font-family="ui-monospace,monospace" letter-spacing=".4">configure · procedural</text>
      </svg>
    </div>
  </div>
</div>

</body>
</html>
